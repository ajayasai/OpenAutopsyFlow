name: Source and workflow tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m coverage run -m pytest
      - run: python -m coverage report --fail-under=85
      - run: node --check openautopsyflow/static/app.js && node --check openautopsyflow/static/workbench.js
      - run: python scripts/publish_github.py --dry-run
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.lock
  browser-https:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock playwright==1.61.0
      - run: python -m pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/workbench_smoke.py --mode live --output artifacts/workbench
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openautopsyflow:test .
      - name: Check non-root container startup with disposable synthetic storage
        run: |
          docker run --name oaf-smoke -d -e OAF_DEMO=1 -p 127.0.0.1:8000:8000 openautopsyflow:test
          trap 'docker logs oaf-smoke; docker rm -f oaf-smoke' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors --max-time 2 http://127.0.0.1:8000/healthz
          docker exec oaf-smoke python -c 'import os; assert os.getuid() != 0'
